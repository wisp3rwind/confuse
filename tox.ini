# Tox (http://tox.testrun.org/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.

[tox]
envlist = py{39,312}-test, py39-flake8, docs
isolated_build = True

[tox:.package]
basepython = python3

[_test]
deps =
    coverage
    nose
    nose-show-skipped
    pyyaml
    pathlib


[_flake8]
deps =
    flake8
    flake8-future-import
    pep8-naming
files = example confuse test docs

[testenv]
passenv =
    NOSE_SHOW_SKIPPED # Undocumented feature of nose-show-skipped.
deps =
    {test,cov}: {[_test]deps}
    py39-flake8: {[_flake8]deps}
commands =
    cov: nosetests --with-coverage {posargs}
    test: nosetests {posargs}
    py39-flake8: flake8 --min-version 3.9 {posargs} {[_flake8]files}

[testenv:docs]
basepython = python3.12
deps = 
    sphinx
    sphinx-rtd-theme
commands = sphinx-build -W -q -b html docs {envtmpdir}/html {posargs}
