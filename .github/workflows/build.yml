name: Build

on:
    push:
        branches:
           - master
    pull_request:
        branches:
            - master

jobs:
    test:
        name: '${{ matrix.os }}: ${{ matrix.tox-env }}'
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                tox-env: [py39-test, py310-test, py311-test,
                          py312-test, pypy-test]
                os: [ubuntu-latest, windows-latest]

                # Only test on a couple of versions on Windows.
                exclude:
                    - os: windows-latest
                      tox-env: py310-test
                    - os: windows-latest
                      tox-env: py311-test
                    - os: windows-latest
                      tox-env: pypy-test

                # Python interpreter versions. :/
                include:
                    - tox-env: py39-test
                      python: 3.9
                    - tox-env: py310-test
                      python: 3.10
                    - tox-env: py311-test
                      python: 3.11
                    - tox-env: py312-test
                      python: 3.12
                    - tox-env: pypy-test
                      python: pypy3

        steps:
            - uses: actions/checkout@v2
            - name: Set up Python ${{ matrix.python }}
              uses: actions/setup-python@v2
              with:
                  python-version: ${{ matrix.python }}
            - name: Install Tox
              run: pip install tox
            - name: Tox
              run: tox -e ${{ matrix.tox-env }}

    style:
        name: Style
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
            - uses: TrueBrain/actions-flake8@master
